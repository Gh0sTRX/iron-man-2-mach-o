name: Mach-O loader source readiness (no VPK)
on:
  workflow_dispatch:
  push:
    branches: [experiment/ios-macho-loader]
    paths:
      - 'vendor/ios-loader-boilerplate/**'
      - 'tests/check_loader_structure.py'
      - 'tests/check_objc_dispatch.py'
      - 'tests/test_objc_sections.py'
      - 'tests/check_objc_external_relocations.py'
      - 'tests/test_objc_classref_bindings.py'
      - 'tools/audit_objc_classref_bindings.py'
      - 'tools/audit_objc_sections.py'
      - 'tests/test_import_audit_synthetic.py'
      - 'tools/audit_ios_imports.py'
      - 'tools/check_vita_dependencies.sh'
      - 'tools/build_loader_objects.sh'
      - '.github/workflows/loader-readiness.yml'
permissions:
  contents: read
jobs:
  loader-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Structural guard
        run: |
          python3 tests/check_loader_structure.py
          python3 tests/check_objc_dispatch.py
          python3 tests/test_objc_sections.py
          python3 tests/check_objc_external_relocations.py
          python3 tests/test_objc_classref_bindings.py
          python3 tests/test_import_audit_synthetic.py
      - name: Compile loader ARM objects using pinned VitaSDK series (no VPK)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace vitasdk/vitasdk:2026.08 sh -lc '
            set -eu
            bash tools/build_loader_objects.sh
          '
