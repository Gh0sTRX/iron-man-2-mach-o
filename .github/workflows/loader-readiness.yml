name: Mach-O loader source readiness (no VPK)
on:
  workflow_dispatch:
  push:
    branches: [experiment/ios-macho-loader]
    paths:
      - 'vendor/ios-loader-boilerplate/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/loader-readiness.yml'
permissions:
  contents: read
jobs:
  loader-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source and host runtime checks with ASan and UBSan
        run: bash tools/test_source.sh
      - name: Full VitaSDK ARM ELF link and production assembly test fixture
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            vitasdk/vitasdk@sha256:8227da1b596d981f4513cd9b36bda1e43857f6dae5bcf4312c1cd40167f7d9bb \
            bash -c 'set -e; bash tools/build_loader_elf.sh; bash tools/build_arm_dispatch_test.sh; bash tools/build_arm_uikit_abi_test.sh'
      - name: Inspect ABI routing in the actual linked ARM import table
        run: python3 tests/test_elf_imports.py --elf build/loader-full/im2_ios_loader
      - name: Execute real ARM and Thumb assembly with synthetic inputs
        run: |
          python3 -m venv build/arm-test-python
          build/arm-test-python/bin/pip install unicorn==2.1.4
          build/arm-test-python/bin/python tests/test_arm_dispatch.py \
            --binary build/arm-dispatch/glue.bin --symbols build/arm-dispatch/symbols.txt
          build/arm-test-python/bin/python tests/test_arm_uikit_abi.py \
            --binary build/arm-uikit/uikit.bin --symbols build/arm-uikit/symbols.txt
          build/arm-test-python/bin/python tests/test_arm_runtime_bridges.py --elf build/loader-full/im2_ios_loader
          build/arm-test-python/bin/python tests/test_owner_startup_replay.py --elf build/loader-full/im2_ios_loader
      - name: VPK remains blocked by missing runtime and hardware evidence
        run: |
          if python3 tools/check_vpk_release_gates.py --evidence docs/vpk_release_evidence.json; then
            echo 'Unexpected release readiness; hardware evidence requires independent review' >&2
            exit 1
          fi
          test ! -f build/loader-full/eboot.bin
          test -z "$(find build -name '*.vpk' -print -quit)"
